<div class="playground-layout">
  <div class="toggle-preview">
   

    <ui-toggle
      [label]="label"
      [showHelp]="showHelp"
      [helpTooltip]="helpTooltip"
      [truncateLabel]="truncateLabel"
      [labelSpacing]="labelSpacing"
      [verticalSpacing]="verticalSpacing"
      [labelAlign]="labelAlign"
      [fullClickable]="fullClickable"
      [(checked)]="checked"
    ></ui-toggle>

   
  </div>
  
  <form class="playground-form">
    <h2>Toggle Settings</h2>

    <label>
      Label:
      <input type="text" [(ngModel)]="label" name="label">
    </label>

    <label>
      <input type="checkbox" [(ngModel)]="showHelp" name="showHelp"> Show Help
    </label>

    <label>
      Help Tooltip:
      <input type="text" [(ngModel)]="helpTooltip" name="helpTooltip">
    </label>

    <label>
      <input type="checkbox" [(ngModel)]="truncateLabel" name="truncateLabel"> Truncate Label
    </label>

    <label>
      Label Spacing:
      <input type="text" [(ngModel)]="labelSpacing" name="labelSpacing">
    </label>

    <label>
      Vertical Spacing:
      <input type="text" [(ngModel)]="verticalSpacing" name="verticalSpacing">
    </label>

    <label>
      Label Align:
      <select [(ngModel)]="labelAlign" name="labelAlign">
        <option value="center">Center</option>
        <option value="top">Top</option>
      </select>
    </label>

    <label>
      <input type="checkbox" [(ngModel)]="fullClickable" name="fullClickable"> Full Clickable
    </label>

    <label>
      <input type="checkbox" [(ngModel)]="checked" name="checked"> Checked
    </label>
  </form>
</div>
